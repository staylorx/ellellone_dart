name: ellellone
description: >-
  An LL(1) compiler toolkit - a table-driven lexical scanner, a grammar engine
  that builds First/Follow/predict sets and an LL(1) parse table, and a
  predictive LL(1) parser with a semantic stack. Reconstructed in Dart with a
  CLI from the 2016 Node original (ellellone-node) per the taybiz
  dart-flutter-bible.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  args: ^2.7.0
  equatable: ^3.0.0
  fpdart: ^1.2.0

dev_dependencies:
  dart_arch_test: ^0.3.1
  lints: ^5.0.0
  shouldly: ^0.5.0+1
  test: ^1.31.1

executables:
  ellellone: ellellone
